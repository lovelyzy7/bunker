plugins { id 'com.android.application'; id 'com.chaquo.python' }

chaquopy {
    defaultConfig {
        version = '3.11'
        extractPackages 'web', 'tools', 'patcher', 'archive', 'bunker_tools'
        pip {
            // Every dependency is vendored as a wheel: pip's cross-platform
            // resolution against the remote indexes backtracks for minutes on
            // this network, and the Chaquopy index only ships native wheels for
            // android_21/24 (re-tagged to android_28 below). Fully offline.
            install '../vendor/wheels/fastapi-0.115.14-py3-none-any.whl'
            install '../vendor/wheels/starlette-0.41.3-py3-none-any.whl'
            install '../vendor/wheels/anyio-4.9.0-py3-none-any.whl'
            install '../vendor/wheels/idna-3.10-py3-none-any.whl'
            install '../vendor/wheels/sniffio-1.3.1-py3-none-any.whl'
            install '../vendor/wheels/typing_extensions-4.12.2-py3-none-any.whl'
            install '../vendor/wheels/click-8.1.7-py3-none-any.whl'
            install '../vendor/wheels/h11-0.14.0-py3-none-any.whl'
            install '../vendor/wheels/pydantic-1.10.22-py3-none-any.whl'
            install '../vendor/wheels/uvicorn-0.34.3-py3-none-any.whl'
            install '../vendor/wheels/jinja2-3.1.6-py3-none-any.whl'
            install '../vendor/wheels/python_multipart-0.0.20-py3-none-any.whl'
            // Native wheels are vendored (like msgpack): the Chaquopy index builds
            // them for android_21/24, which pip's exact platform tag for
            // minSdk 28 won't take directly.
            install '../vendor/wheels/pycryptodome-3.21.0-0-cp311-cp311-android_28_arm64_v8a.whl'
            install '../vendor/wheels/itsdangerous-2.2.0-py3-none-any.whl'
            install '../vendor/wheels/msgpack-1.1.1-py3-none-any.whl'
            install '../vendor/wheels/lz4-4.3.2-0-cp311-cp311-android_28_arm64_v8a.whl'
            // jinja2's native dependency, vendored for the same reason.
            install '../vendor/wheels/markupsafe-3.0.3-0-cp311-cp311-android_28_arm64_v8a.whl'
        }
    }
}

android {
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    namespace = 'org.veritr1x.bunker'
    compileSdk = 36
    defaultConfig {
        applicationId = 'org.veritr1x.bunker'
        minSdk = 28
        targetSdk = 36
        // Bunker's version (scripts/version.py), shown in About and the exported log.
        // The installed app keeps the game's own version, 3.7.1.
        def bunkerVersion = providers.exec { commandLine 'python3', "${rootDir}/../scripts/version.py" }.standardOutput.asText.get().trim()
        versionCode = 1
        versionName = bunkerVersion
        buildConfigField 'String', 'BUNKER_VERSION', "\"${bunkerVersion}\""
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig = true }
    packaging { jniLibs { useLegacyPackaging = false } }
    buildTypes { release { minifyEnabled = false } }
}

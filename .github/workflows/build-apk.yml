name: Build APK

# Builds a Bunker APK in the cloud, for 日服 (JP) and 全球服 (EN) alike. Nothing is
# uploaded anywhere else: the workflow downloads your own game files, builds the
# launcher, assembles and signs the APK, and keeps it as an artifact.
#
# Inputs:
#   region          jp (日服) or en (全球服)
#   game_apk_url    the original 3.7.1 ARM64 game APK — a Google Drive link, a
#                   release asset (public or private), or any direct URL
#   game_apk_sha256 optional, checked before building
#   master_url      the original 20240404193219.bin.e
#   master_sha256   optional, checked before building
#   mod_menu        add the prebuilt Mod Menu payload (default: off)
#   port_offset     move the game's ports 8003/8080 when another app holds them
#
# A private release asset needs the GAME_ASSET_TOKEN secret (contents: read) or
# a public URL. Browser links to private assets answer 404, so the download goes
# through the API.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Game release"
        type: choice
        options: [jp, en]
        default: jp
      game_apk_url:
        description: "Original game APK URL (Drive link, release asset or direct URL)"
        required: true
      game_apk_sha256:
        description: "Expected SHA-256 of the game APK (optional)"
        default: ""
      master_url:
        description: "Original 20240404193219.bin.e URL"
        required: true
      master_sha256:
        description: "Expected SHA-256 of the master data (optional)"
        default: "60555788242de9a0580b0d86f6d109d67bd9cabd16d7bcda9b9a99745f270778"
      mod_menu:
        description: "Add the Mod Menu"
        type: boolean
        default: false
      port_offset:
        description: "Port offset (0 keeps 8003/8080)"
        default: "0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
      GOFLAGS: -mod=readonly
      REGION: ${{ inputs.region }}
      PORT_OFFSET: ${{ inputs.port_offset }}
      MOD_MENU: ${{ inputs.mod_menu }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: server/go.sum

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" >/dev/null

      - name: Install protobuf and build helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-build.txt gdown

      - name: Fetch the game files
        env:
          GAME_ASSET_TOKEN: ${{ secrets.GAME_ASSET_TOKEN }}
          GAME_APK_URL: ${{ inputs.game_apk_url }}
          GAME_APK_SHA: ${{ inputs.game_apk_sha256 }}
          MASTER_URL: ${{ inputs.master_url }}
          MASTER_SHA: ${{ inputs.master_sha256 }}
        run: |
          game_args=()
          if [ -n "$GAME_APK_SHA" ]; then game_args=(--sha256 "$GAME_APK_SHA"); fi
          master_args=()
          if [ -n "$MASTER_SHA" ]; then master_args=(--sha256 "$MASTER_SHA"); fi
          python scripts/fetch_input.py "$GAME_APK_URL" "$RUNNER_TEMP/game.apk" "${game_args[@]}"
          python scripts/fetch_input.py "$MASTER_URL" "$RUNNER_TEMP/master.bin.e" "${master_args[@]}"

      - name: Prepare the sources
        run: python scripts/prepare.py

      - name: Build the launcher
        run: |
          make -C server proto
          bash android/tools/build_native.sh
          cd android && ./gradlew --no-daemon assembleDebug

      - name: Assemble and sign the APK
        run: |
          mkdir -p artifacts
          args=(--apk "$RUNNER_TEMP/game.apk" --master "$RUNNER_TEMP/master.bin.e"
                --companion-apk android/app/build/outputs/apk/debug/app-debug.apk
                --output "artifacts/bunker-${REGION}.apk" --port-offset "$PORT_OFFSET")
          if [ "$MOD_MENU" = "true" ]; then args+=(--mod-menu); fi
          python web/webbuild.py "${args[@]}" | tee artifacts/build.log
          sha256sum "artifacts/bunker-${REGION}.apk" > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Check the result
        run: |
          python - "$REGION" "$MOD_MENU" <<'PY'
          import json, sys, zipfile
          from pathlib import Path
          region, modmenu = sys.argv[1], sys.argv[2] == "true"
          apk = Path("artifacts") / f"bunker-{region}.apk"
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              info = json.loads(archive.read("assets/lunar/build.json"))
          print(f"{apk}  {apk.stat().st_size} bytes")
          print(json.dumps(info, indent=1))
          assert info["region"] == region, info
          assert "assets/lunar/20240404193219.bin.e" in names, "master data missing"
          assert "assets/lunar/original-master.bin.e" in names, "original master data missing"
          assert bool(info.get("modMenu")) == modmenu, info
          print("OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bunker-${{ inputs.region }}-${{ github.sha }}
          path: |
            artifacts/bunker-*.apk
            artifacts/SHA256SUMS
            artifacts/build.log
          if-no-files-found: error

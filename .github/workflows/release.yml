# Builds a release from a v<VERSION> tag: checks the tag, builds Bunker's
# bundles, creates the GitHub Release (notes from CHANGELOG.md; bundles and
# update.json for the launcher's self-update), then has pages.yml publish the
# web builder from the tag.
# No game files or master data are built, attached or published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install pycryptodome msgpack lz4
      - name: Materialise lunar-scripts-zh
        # upstream-local 是目录挂载（Windows junction）；CI 无本地挂载时从 GitHub
        # 取实体。内容正确性由 prepare 的 contract-digest 预检（upstream.lock pin）。
        run: |
          if [ ! -d upstream/lunar-scripts-zh ]; then
            git clone --depth 1 https://github.com/lovelyzy7/lunar-scripts-zh upstream/lunar-scripts-zh
          fi
      - name: Unit tests
        run: |
          (cd scripts && python3 -m unittest test_version test_release_assets test_zh_switch)
          (cd android/tools && python3 -m unittest test_privacy test_update_apk test_build_info test_master_patch test_assemble_stream)
      - name: Style checks
        continue-on-error: true   # a hint, not a gate
        run: |
          python3 -m pip install --quiet ruff
          ruff check web scripts android/tools
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import release_assets; release_assets.changelog_section(open('CHANGELOG.md', encoding='utf-8').read(), open('VERSION').read().strip())"

  android:
    needs: check
    name: Android launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null
      - name: Materialise lunar-scripts-zh
        # upstream-local 是目录挂载（Windows junction）；CI 无本地挂载时从 GitHub
        # 取实体。内容正确性由 prepare 的 contract-digest 预检（upstream.lock pin）。
        run: |
          if [ ! -d upstream/lunar-scripts-zh ]; then
            git clone --depth 1 https://github.com/lovelyzy7/lunar-scripts-zh upstream/lunar-scripts-zh
          fi
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
      - name: Build the launcher APK
        run: |
          android/tools/build_native.sh
          cd android && ./gradlew --no-daemon assembleDebug
      - name: Signing round-trip (apksigner)
        # apk_sign.py writes the v2 block itself; this is the only check that the
        # Android tools accept it, and it used to be skipped everywhere.
        run: |
          python3 -m pip install --quiet pycryptodome
          cd android/tools && python3 test_apk_sign.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-launcher
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    needs: check
    name: Windows launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache: false
      # Bunker.exe holds none of the Android SDK: it downloads the emulator from Google on first start.
      - name: Test and build Bunker.exe
        run: |
          cd windows
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$(cat ../VERSION)" -o "../out/Bunker-$(cat ../VERSION).exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: out

  release:
    name: GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialise lunar-scripts-zh
        # build_site.py packs the module's patchers/tables into the site payload.
        run: |
          if [ ! -d upstream/lunar-scripts-zh ]; then
            git clone --depth 1 https://github.com/lovelyzy7/lunar-scripts-zh upstream/lunar-scripts-zh
          fi
      - uses: actions/download-artifact@v4
        with:
          name: android-launcher
          path: bundles/android
      - uses: actions/download-artifact@v4
        with:
          name: windows-launcher
          path: dist
      - name: Bundles, update.json and notes
        run: >
          python3 scripts/release_assets.py --version "$(cat VERSION)"
          --companion-apk bundles/android/app-debug.apk
          --out dist
      # The launcher bundle the web builder downloads, attached here so the page
      # can offer a GitHub download proxy (the asset itself sends no CORS header).
      - name: The site's launcher bundle
        run: python3 web/build_site.py --companion-apk bundles/android/app-debug.apk --output site --no-pyodide
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe dist/update.json site/bundles/android.zip site/bundles/modmenu.zip --title "Bunker $(cat VERSION)" --notes-file dist/notes.md --verify-tag

  publish:
    name: Publish the web builder
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # GitHub Pages deploys only from main, so pages.yml runs on main and builds the site from this tag.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$GITHUB_REF_NAME"
